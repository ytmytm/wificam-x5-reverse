[Unit]
# Start the camera stack first, but keep HA independent if the camera is offline.
Wants=x5-mediamtx.service x5-rtsp-publish.service
After=network-online.target x5-mediamtx.service x5-rtsp-publish.service

[Service]
# HA 2023.10 requests numpy==1.26.0 on every boot. ARMv7 has no matching
# wheel and the server's GCC 7 cannot build it; numpy 1.23.2 is already
# installed, so skip only this package rather than all HA requirements.
ExecStart=
ExecStart=/home/homeassistant/homeassistant/bin/hass -c "/home/homeassistant/.homeassistant" --skip-pip-packages numpy
